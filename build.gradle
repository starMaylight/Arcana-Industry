plugins {
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
minecraft { mappings channel: mapping_channel, version: mapping_version }
repositories {
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.20.0.106')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.20.0.106')
}
// This development-only listener is not part of the distributed mod.
sourceSets.main.java.exclude '**/ClientSmoke.java'
tasks.named('processResources', ProcessResources).configure {
    def properties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
        mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
        mod_description: mod_description]
    inputs.properties properties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand properties + [project: project] }
}
tasks.named('jar', Jar).configure {
    manifest { attributes('Specification-Title': mod_id, 'Specification-Vendor': mod_authors,
        'Specification-Version': '1', 'Implementation-Title': project.name,
        'Implementation-Version': project.version, 'Implementation-Vendor': mod_authors) }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('LICENSE') { into 'META-INF'; rename { 'LICENSE_arcana_industry' } }
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
