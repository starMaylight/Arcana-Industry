name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != tag || ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.-]+)?$ ]]; then
            echo 'Run this workflow on a version tag, e.g. v1.0 or v1.1.0-beta.1.' >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build distribution
        run: gradle --no-daemon --stacktrace clean build "-Pmod_version=$RELEASE_VERSION"
      - name: Check and checksum distribution
        shell: bash
        run: |
          set -euo pipefail
          jar="build/libs/arcana_industry-${RELEASE_VERSION}.jar"
          test -s "$jar"
          unzip -tq "$jar"
          unzip -p "$jar" META-INF/mods.toml | tr -d '[:space:]' | grep -F "version=\"${RELEASE_VERSION}\""
          cd build/libs
          sha256sum "arcana_industry-${RELEASE_VERSION}.jar" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          jar="build/libs/arcana_industry-${RELEASE_VERSION}.jar"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published files.' >&2
            exit 1
          fi
          flags=()
          [[ "$RELEASE_VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$RELEASE_TAG" "$jar" build/libs/SHA256SUMS.txt \
            --verify-tag --title "Arcana Industry $RELEASE_VERSION" --generate-notes "${flags[@]}"
